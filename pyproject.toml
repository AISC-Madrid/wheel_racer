[project]
name = "wheel-racer"
version = "0.1.0"
description = "Hand-steered arcade racer for the AISC Madrid tabling booth"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=1.26",
    "pygame>=2.5",
]

# The computer-vision stack is optional on purpose: the game runs end to end
# with the keyboard input source, so contributors can work on physics, track
# and rendering without installing MediaPipe.
[project.optional-dependencies]
cv = [
    "opencv-python>=4.9",
    "mediapipe>=0.10.14",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wheel_racer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
