[project]
name = "wheel-racer"
version = "0.1.0"
description = "Hand-steered arcade racer for the AISC Madrid tabling booth"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=1.26",
    "pygame>=2.5",
]

# The computer-vision stack is optional on purpose: the game runs end to end
# with the keyboard input source, so contributors can work on physics, track
# and rendering without installing MediaPipe.
[project.optional-dependencies]
cv = [
    "opencv-python>=4.9",
    # Pinned below 1.0 deliberately. MediaPipe 1.0 removed `mp.solutions.hands`
    # in favour of the Tasks API, which on macOS arm64 crashes the process on
    # startup inside its Metal path — and which also needs the landmark model
    # downloaded separately, an extra thing to go wrong at an outdoor booth.
    # 0.10.x carries its model inside the package and runs. Do not "upgrade"
    # this without testing on the machine that will be at the table.
    "mediapipe>=0.10.14,<1.0",
]
# The web server that holds the results. Optional for the same reason the
# camera stack is: the game has to build and run on a booth laptop without
# dragging a web framework along, and the container that runs the server has no
# use for pygame.
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8.0",
    # Starlette's test client is built on httpx. Only the server's tests need
    # it, and they skip themselves when the server extra is not installed.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wheel_racer"]

[tool.pytest.ini_options]
# The server's tests live next to the server rather than in `tests/`, so that
# the two halves of the repository stay separable. They skip themselves when
# the `server` extra is not installed, which keeps `pytest` green on a machine
# set up only to work on the game.
testpaths = ["tests", "server/tests"]
pythonpath = ["src", "server"]
